name: Compilar APK Android (PalCraft 2D)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Preparar proyecto Android con Capacitor
        run: |
          mkdir -p www
          
          # Busca cualquier archivo .html en el repositorio automáticamente
          HTML_FILE=$(find . -maxdepth 3 -name "*.html" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            echo "Archivo encontrado en: $HTML_FILE"
            cp "$HTML_FILE" www/index.html
          else
            echo "ERROR: No se encontró ningún archivo .html en el repositorio."
            exit 1
          fi

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          npx cap init "PalCraft2D" "com.palcraft2d.monsterbase" --web-dir www
          npx cap add android

          # Forzar orientación Horizontal (Landscape)
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/g' android/app/src/main/AndroidManifest.xml

          npx cap copy android

      - name: 5. Compilar el archivo APK (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 6. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: PalCraft-2D-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
