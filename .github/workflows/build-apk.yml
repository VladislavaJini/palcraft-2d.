name: Compilar APK Android (PalCraft 2D)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Crear proyecto Capacitor y configurar Pantalla Horizontal
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "ERROR: No se encontró index.html en la raíz del repositorio"
            exit 1
          fi

          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          npx cap init "PalCraft2D" "com.palcraft2d.monsterbase" --web-dir www
          npx cap add android

          # Forzar orientación Horizontal (sensorLandscape) en AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/g' android/app/src/main/AndroidManifest.xml

          # Configurar Pantalla Completa sin errores de indentación
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowContentOverlay">@null</item>\n    </style>\n    <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">\n        <item name="windowActionBar">false</item>\n        <item name="windowNoTitle">true</item>\n        <item name="android:background">@null</item>\n        <item name="android:windowFullscreen">true</item>\n    </style>\n    <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n        <item name="android:background">@drawable/splash</item>\n        <item name="android:windowFullscreen">true</item>\n    </style>\n</resources>\n' > android/app/src/main/res/values/styles.xml

          npx cap copy android

      - name: 6. Compilar el archivo APK (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: PalCraft-2D-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
