name: Compilar APK Android (PalCraft 2D)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Crear proyecto Capacitor y configurar Pantalla Horizontal
        run: |
          mkdir -p www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "PalCraft 2D" "com.palcraft2d.monsterbase" --web-dir www
          npx cap add android

          # Forzar orientación Horizontal (sensorLandscape) en AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/g' android/app/src/main/AndroidManifest.xml

          # Configurar Pantalla Completa inmersiva sin barra de título
          sed -i 's/Theme.AppCompat.NoActionBar/Theme.AppCompat.NoActionBar.FullScreen/g' android/app/src/main/res/values/styles.xml || true
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">@drawable/splash</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          npx cap copy android

      - name: 6. Compilar el archivo APK (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: PalCraft-2D-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
