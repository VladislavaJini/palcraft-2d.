<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nexus Creatures - Isometric Phase 2 Fixed</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #060a12;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hud-top {
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 15;
    pointer-events: none;
  }
  .player-card {
    background: linear-gradient(180deg, rgba(14, 25, 45, 0.95) 0%, rgba(8, 14, 28, 0.97) 100%);
    border: 2px solid #00d2ff;
    border-radius: 8px;
    padding: 6px 12px;
    color: white;
    font-size: 12px;
    box-shadow: 0 0 14px rgba(0, 210, 255, 0.4);
    pointer-events: auto;
  }

  #controls-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  .action-btn-f2 {
    position: absolute;
    bottom: 25px;
    right: 25px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #059669, #047857);
    border: 3px solid #6ee7b7;
    color: white;
    font-weight: 800;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 0 #050811, 0 0 16px rgba(52, 211, 153, 0.5);
    cursor: pointer;
    pointer-events: auto;
    text-shadow: 1px 1px 0 #000;
  }
  .action-btn-f2:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #050811;
  }
</style>
</head>
<body>

<div id="hud-top">
  <div class="player-card">
    <div style="font-weight:bold; color:#38bdf8;">NEXUS CREATURES</div>
    <div style="font-size:10px; color:#cbd5e1; margin-top:2px;">Fase 2: Motor Isométrico 2.5D</div>
  </div>
  <div class="player-card" style="text-align:right;">
    <div style="font-size:10px; color:#34d399;">● Y-SORT ACTIVO</div>
    <div style="font-size:11px; font-weight:bold;">Perspectiva Diamante</div>
  </div>
</div>

<div id="controls-container">
  <button class="action-btn-f2" onclick="resetPlayerPos()">
    <span style="font-size:22px;">🏠</span>
    <span>CENTRO</span>
  </button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Joystick Virtual Táctil Izquierdo
let joystick = {
  active: false,
  touchId: null,
  startX: 90,
  startY: window.innerHeight - 110,
  currX: 90,
  currY: window.innerHeight - 110,
  dx: 0,
  dy: 0,
  maxRadius: 55
};

window.addEventListener('touchstart', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.clientX < window.innerWidth * 0.55 && !joystick.active) {
      joystick.active = true;
      joystick.touchId = t.identifier;
      joystick.startX = t.clientX;
      joystick.startY = t.clientY;
      joystick.currX = t.clientX;
      joystick.currY = t.clientY;
    }
  }
}, { passive: true });

window.addEventListener('touchmove', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (joystick.active && t.identifier === joystick.touchId) {
      let dx = t.clientX - joystick.startX;
      let dy = t.clientY - joystick.startY;
      const dist = Math.hypot(dx, dy);
      if (dist > joystick.maxRadius) {
        dx = (dx / dist) * joystick.maxRadius;
        dy = (dy / dist) * joystick.maxRadius;
      }
      joystick.currX = joystick.startX + dx;
      joystick.currY = joystick.startY + dy;
      joystick.dx = dx / joystick.maxRadius;
      joystick.dy = dy / joystick.maxRadius;
    }
  }
}, { passive: true });

function endTouch(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (joystick.active && t.identifier === joystick.touchId) {
      joystick.active = false;
      joystick.touchId = null;
      joystick.dx = 0;
      joystick.dy = 0;
    }
  }
}
window.addEventListener('touchend', endTouch, { passive: true });
window.addEventListener('touchcancel', endTouch, { passive: true });

// Posición del jugador en coordenadas del mundo
let player = {
  x: 0,
  y: 0,
  speed: 160,
  radius: 16
};

function resetPlayerPos() {
  player.x = 0;
  player.y = 0;
}

// Objetos estáticos de prueba (Árboles y rocas)
const worldObjects = [
  { type: 'tree', x: -100, y: -100 },
  { type: 'tree', x: 120, y: -140 },
  { type: 'rock', x: -80, y: 100 },
  { type: 'tree', x: 100, y: 120 }
];

// Conversión de coordenadas Cartesianas a Isométricas (Diamante 2:1)
function worldToIso(wx, wy) {
  const tileWidth = 64;
  const tileHeight = 32;
  const isoX = (wx - wy) * (tileWidth / 2);
  const isoY = (wx + wy) * (tileHeight / 2);
  return { x: isoX, y: isoY };
}

let lastTime = performance.now();

function update(dt) {
  if (Math.abs(joystick.dx) > 0.05 || Math.abs(joystick.dy) > 0.05) {
    player.x += (joystick.dx * 1.2 - joystick.dy * 0.8) * player.speed * dt;
    player.y += (joystick.dx * 0.8 + joystick.dy * 1.2) * player.speed * dt;
  }
}

function draw() {
  ctx.fillStyle = '#3f6a34';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 3;

  const playerIso = worldToIso(player.x, player.y);
  const camX = Math.floor(playerIso.x);
  const camY = Math.floor(playerIso.y);

  ctx.save();
  ctx.translate(centerX - camX, centerY - camY);

  // 1. Dibujar losetas de suelo isométricas
  const gridSize = 6;
  const step = 96;
  for (let gx = -gridSize; gx <= gridSize; gx++) {
    for (let gy = -gridSize; gy <= gridSize; gy++) {
      const wx = gx * step;
      const wy = gy * step;
      const iso = worldToIso(wx, wy);

      ctx.beginPath();
      ctx.moveTo(iso.x, iso.y);
      ctx.lineTo(iso.x + 48, iso.y + 24);
      ctx.lineTo(iso.x, iso.y + 48);
      ctx.lineTo(iso.x - 48, iso.y + 24);
      ctx.closePath();

      ctx.fillStyle = (gx + gy) % 2 === 0 ? '#437538' : '#39612f';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0, 210, 255, 0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // 2. Sistema de Ordenamiento de Profundidad (Y-Sorting)
  const renderList = [];

  // Agregar al jugador
  renderList.push({
    yOrder: player.y,
    draw: () => {
      const isoP = worldToIso(player.x, player.y);
      // Sombra
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(isoP.x, isoP.y + 10, 14, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cuerpo
      ctx.fillStyle = '#1d4ed8';
      ctx.beginPath();
      ctx.arc(isoP.x, isoP.y - 12, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#00d2ff';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Cabeza
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(isoP.x - 6, isoP.y - 26, 12, 10);
    }
  });

  // Agregar objetos
  worldObjects.forEach(obj => {
    renderList.push({
      yOrder: obj.y,
      draw: () => {
        const isoObj = worldToIso(obj.x, obj.y);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(isoObj.x, isoObj.y + 10, obj.type === 'tree' ? 16 : 14, obj.type === 'tree' ? 8 : 7, 0, 0, Math.PI * 2);
        ctx.fill();

        if (obj.type === 'tree') {
          ctx.fillStyle = '#5c2d16';
          ctx.fillRect(isoObj.x - 5, isoObj.y - 18, 10, 22);
          ctx.fillStyle = '#16a34a';
          ctx.beginPath();
          ctx.arc(isoObj.x, isoObj.y - 38, 24, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#22c55e';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          ctx.fillStyle = '#475569';
          ctx.beginPath();
          ctx.arc(isoObj.x, isoObj.y - 10, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    });
  });

  // Ordenar de menor a mayor Y
  renderList.sort((a, b) => a.yOrder - b.yOrder);
  renderList.forEach(item => item.draw());

  ctx.restore();

  // Dibujar Joystick Táctil
  if (joystick.active) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 210, 255, 0.7)';
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(10, 20, 38, 0.5)';
    ctx.beginPath();
    ctx.arc(joystick.startX, joystick.startY, joystick.maxRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(joystick.currX, joystick.currY, 22, 0, Math.PI * 2);
    ctx.fillStyle = '#00d2ff';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
    ctx.restore();
  }
}

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
