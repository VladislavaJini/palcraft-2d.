<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PalCraft 2D: CrossPixel Edition</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    margin: 0;
    padding: 0;
    font-family: 'Courier New', Courier, monospace;
    image-rendering: pixelated;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0d1322;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* HUD Superior Estilo RPG 16-Bit (CrossCode UI) */
  #hud {
    position: fixed;
    top: 10px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .resource-bar {
    display: flex;
    gap: 12px;
    background: #131c31;
    padding: 7px 14px;
    border: 3px solid #38bdf8;
    box-shadow: 0 4px 0 #090d16, inset 0 0 8px rgba(56, 189, 248, 0.25);
    color: #f8fafc;
    font-weight: bold;
    font-size: 14px;
    align-items: center;
  }
  .res-item {
    display: flex;
    align-items: center;
    gap: 5px;
    text-shadow: 2px 2px 0 #000;
  }
  .hud-right {
    display: flex;
    gap: 10px;
    align-items: center;
    pointer-events: auto;
  }
  #btn-mute {
    background: #1e293b;
    color: #38bdf8;
    border: 3px solid #38bdf8;
    box-shadow: 0 4px 0 #090d16;
    padding: 6px 12px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
  }
  #btn-mute:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #090d16;
  }
  #save-indicator {
    background: #059669;
    border: 2px solid #34d399;
    color: white;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.25s;
    text-shadow: 1px 1px 0 #000;
  }

  /* Controles Táctiles Derecha (Estilo Arcade Pixel) */
  #controls-right {
    position: fixed;
    bottom: 18px;
    right: 22px;
    width: 195px;
    height: 195px;
    pointer-events: none;
    z-index: 10;
  }
  .action-btn {
    position: absolute;
    pointer-events: auto;
    border-radius: 14px;
    border: 3px solid #f8fafc;
    color: white;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 0 #090d16;
    cursor: pointer;
    text-shadow: 2px 2px 0 #000;
  }
  .action-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #090d16;
  }
  #btn-attack {
    width: 84px;
    height: 84px;
    bottom: 4px;
    right: 4px;
    background: #dc2626;
    border-color: #fca5a5;
    font-size: 12px;
  }
  #btn-capture {
    width: 70px;
    height: 70px;
    bottom: 18px;
    left: 0px;
    background: #0284c7;
    border-color: #7dd3fc;
    font-size: 11px;
  }
  #btn-base {
    width: 70px;
    height: 70px;
    top: 4px;
    right: 18px;
    background: #d97706;
    border-color: #fde68a;
    font-size: 11px;
  }
  .btn-icon {
    font-size: 22px;
    line-height: 1;
    margin-bottom: 3px;

    position: fixed;
    inset: 0;
    background: rgba(9, 13, 24, 0.92);
    display: none;
    flex-direction: column;
    z-index: 50;
    color: #f8fafc;
    padding: 14px 22px;
    border: 4px solid #38bdf8;

    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #1e293b;
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  .modal-tabs {
    display: flex;
    gap: 10px;
  }
  .tab-btn {
    background: #131c31;
    color: #94a3b8;
    border: 3px solid #334155;
    box-shadow: 0 4px 0 #090d16;
    padding: 8px 14px;

    text-shadow: 1px 1px 0 #000;

<script>
/**
 * ============================================================================
 * 1. SINTETIZADOR DE AUDIO RETRO 16-BITS (Web Audio API - Cero archivos externos)
 * ============================================================================
 */
const SoundFX = {
  ctx: null,
  muted: false,
  bgmStarted: false,
  stepIndex: 0,
  bgmInterval: null,

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    if (!this.bgmStarted && this.ctx) {
      this.bgmStarted = true;
      this.startRetroBGM();
    }
  },

  tone(freq, type, duration, vol = 0.12, slideFreq = null, delay = 0) {
    if (this.muted || !this.ctx) return;
    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideFreq) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideFreq), now + duration);
    }
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  },

  // Sonidos de Interfaz (UI)
  uiClick() { this.init(); this.tone(720, 'square', 0.06, 0.1, 1080); },
  uiTab() { this.init(); this.tone(520, 'triangle', 0.07, 0.12, 840); },
  uiOpen() {
    this.init();
    this.tone(440, 'square', 0.07, 0.09, null, 0);
    this.tone(660, 'square', 0.09, 0.09, null, 0.06);
  },
  uiClose() {
    this.init();
    this.tone(660, 'square', 0.06, 0.09, null, 0);
    this.tone(380, 'square', 0.09, 0.09, null, 0.05);
  },
  uiUpgrade() {
    this.init();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
      this.tone(f, 'square', 0.09, 0.11, null, idx * 0.06);
    });
  },
  uiError() {
    this.init();
    this.tone(180, 'sawtooth', 0.12, 0.12, 120, 0);
    this.tone(140, 'sawtooth', 0.16, 0.12, 95, 0.1);
  },

  // Sonidos de Juego y Combate
  swing() { this.init(); this.tone(310, 'triangle', 0.09, 0.11, 110); },
  hitWood() { this.init(); this.tone(175, 'square', 0.07, 0.12, 85); },
  hitRock() { this.init(); this.tone(920, 'triangle', 0.06, 0.11, 310); },
  hitMonster() { this.init(); this.tone(240, 'sawtooth', 0.09, 0.12, 120); },
  playerHurt() { this.init(); this.tone(150, 'sawtooth', 0.22, 0.16, 65); },
  throwSphere() { this.init(); this.tone(360, 'sine', 0.22, 0.13, 980); },
  captureSuccess() {
    this.init();
    // Fanfarria retro de captura exitosa
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    notes.forEach((n, i) => this.tone(n, 'square', 0.13, 0.12, null, i * 0.08));
  },
  captureFail() {
    this.init();
    this.tone(300, 'sawtooth', 0.14, 0.11, 210, 0);
    this.tone(210, 'sawtooth', 0.2, 0.11, 130, 0.14);
  },
  bossRoar() {
    this.init();
    this.tone(130, 'sawtooth', 0.45, 0.16, 52, 0);
    this.tone(95, 'square', 0.45, 0.14, 42, 0.05);
  },

  // Música Retro Chiptune Estilo CrossCode (Arpegio 16-bit + Bajo)
  startRetroBGM() {
    const melody = [
      329.63, 392.00, 493.88, 659.25, 587.33, 493.88, 392.00, 493.88,
      293.66, 369.99, 440.00, 587.33, 523.25, 440.00, 369.99, 440.00,
      261.63, 329.63, 392.00, 523.25, 493.88, 392.00, 329.63, 392.00,
      246.94, 329.63, 392.00, 493.88, 587.33, 493.88, 392.00, 329.63
    ];
    const bass = [
      164.81, 164.81, 146.83, 146.83, 130.81, 130.81, 123.47, 146.83
    ];

    this.bgmInterval = setInterval(() => {
      if (this.muted || !this.ctx || this.ctx.state !== 'running') return;
      const mNote = melody[this.stepIndex % melody.length];
      this.tone(mNote, 'triangle', 0.14, 0.035);

      if (this.stepIndex % 4 === 0) {
        const bNote = bass[Math.floor(this.stepIndex / 4) % bass.length];
        this.tone(bNote, 'square', 0.32, 0.028);
      }
      this.stepIndex++;
    }, 185);
  }
};

function toggleAudioMute() {
  SoundFX.init();
  SoundFX.muted = !SoundFX.muted;
  const btn = document.getElementById('btn-mute');
  btn.textContent = SoundFX.muted ? '🔇 MUTE' : '🔊 AUDIO';
  if (!SoundFX.muted) SoundFX.uiClick();
}

// Desbloquear audio en el primer toque
window.addEventListener('touchstart', () => SoundFX.init(), { once: true });
window.addEventListener('mousedown', () => SoundFX.init(), { once: true });

/**
 * ============================================================================
 * 2. MOTOR DE SPRITES PIXEL ART PROCEDURAL (16-Bits / CrossCode Style)
 * ============================================================================
 */
const SPRITE_CACHE = {};

function createPixelSprite(key, matrix, palette, scale = 3) {
  if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
  const rows = matrix.length;
  const cols = matrix[0].length;
  const off = document.createElement('canvas');
  off.width = cols * scale;
  off.height = rows * scale;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = false;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = matrix[r][c];
      if (ch !== '.' && palette[ch]) {
        octx.fillStyle = palette[ch];
        octx.fillRect(c * scale, r * scale, scale, scale);
      }
    }
  }
  SPRITE_CACHE[key] = off;
  return off;
}

function initSprites() {
  // Jugador
  createPixelSprite('player', PIXEL_MATRICES.player, {
    K: '#090d16', H: '#e2e8f0', C: '#38bdf8', S: '#fed7aa', O: '#0284c7', R: '#ef4444', B: '#1d4ed8'
  }, 3);

  // Árbol y Roca
  createPixelSprite('tree', PIXEL_MATRICES.tree, {
    K: '#090d16', L: '#4ade80', G: '#15803d', T: '#78350f'
  }, 4);

  createPixelSprite('rock', PIXEL_MATRICES.stoneNode, {
    K: '#090d16', S: '#94a3b8', D: '#475569', C: '#38bdf8'
  }, 4);

  // Especies Normales y Versiones ALPHA (Jefes Gigantes)
  PAL_SPECIES.forEach(sp => {
    createPixelSprite('pal_' + sp.type, PIXEL_MATRICES[sp.type], sp.palette, 3);
    createPixelSprite('alpha_' + sp.type, PIXEL_MATRICES[sp.type], sp.palette, 5);
  });
}

/**
 * ============================================================================
 * 3. ESTADO DEL JUEGO Y MUNDO (Con Jefes de Mapa Alpha)
 * ============================================================================
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const WORLD = {
  width: 2800,
  height: 2800,
  baseX: 1400,
  baseY: 1400,
  baseRadius: 310
};

  wood: 20,
  stone: 15,
  spheres: 10,
  pals: [],
  upgrades: {

};

let player = {

let resources = [];

let floatingTexts = [];
let terrainTiles = [];

let joystick = {
  active: false,
  touchId: null,
  startX: 110,
  startY: window.innerHeight - 110,
  currX: 110,
  currY: window.innerHeight - 110,
  dx: 0,
  dy: 0,
  maxRadius: 55
};

// ============================================================================
// GUARDADO Y CARGA (Compatible con v1)
// ============================================================================
function saveGame() {
  try {
    localStorage.setItem('palcraft_save_v1', JSON.stringify({
      wood: state.wood,
      stone: state.stone,
      spheres: state.spheres,
      upgrades: state.upgrades,
      pals: state.pals
    }));
    const ind = document.getElementById('save-indicator');
    ind.style.opacity = '1';
    setTimeout(() => ind.style.opacity = '0', 1200);
  } catch (e) {}
}

function loadGame() {
  try {
    const raw = localStorage.getItem('palcraft_save_v1');
    if (raw) {
      const parsed = JSON.parse(raw);
      state.wood = parsed.wood ?? 20;
      state.stone = parsed.stone ?? 15;
      state.spheres = parsed.spheres ?? 10;
      if (parsed.upgrades) Object.assign(state.upgrades, parsed.upgrades);
      if (Array.isArray(parsed.pals)) {
        // Asegurar que los Pals de la v1 tengan spriteType asignado
        state.pals = parsed.pals.map(p => ({
          ...p,
          spriteType: p.spriteType || 'leaf',
          isAlpha: !!p.isAlpha
        }));
      }
    }
  } catch (e) {}
}

// ============================================================================
// INICIALIZACIÓN DEL MUNDO Y JEFES ALPHA
// ============================================================================
function initWorld() {
  initSprites();
  loadGame();

  // Decoración Pixel Art del Suelo (Flores de cristal y pasto estilo CrossCode)
  for (let i = 0; i < 420; i++) {
    terrainTiles.push({
      x: Math.floor((Math.random() * WORLD.width) / 16) * 16,
      y: Math.floor((Math.random() * WORLD.height) / 16) * 16,
      type: Math.random() > 0.82 ? 'crystalFlower' : 'grass',
      color: Math.random() > 0.5 ? '#1e3a2f' : '#264a3b'
    });
  }

  // Anillo de recursos cercano a la base
  for (let i = 0; i < 16; i++) {
    const angle = (i / 16) * Math.PI * 2;
    const dist = 175 + (i % 2) * 85;
    resources.push(createResourceNode(
      WORLD.baseX + Math.cos(angle) * dist,
      WORLD.baseY + Math.sin(angle) * dist,
      i % 2 === 0 ? 'tree' : 'rock'
    ));
  }

  // Recursos por todo el mapa
  for (let i = 0; i < 100; i++) {
    let rx = 120 + Math.random() * (WORLD.width - 240);
    let ry = 120 + Math.random() * (WORLD.height - 240);
    if (Math.hypot(rx - WORLD.baseX, ry - WORLD.baseY) < 340) continue;
    resources.push(createResourceNode(rx, ry, Math.random() > 0.45 ? 'tree' : 'rock'));
  }

  // Monstruos Salvajes Normales
  for (let i = 0; i < 22; i++) {
    spawnWildPal(false);
  }

  // 4 JEFES DE MAPA (ALPHA PALS) en los 4 cuadrantes del mundo
  const bossCorners = [
    { x: 550, y: 550, spec: PAL_SPECIES[0] },
    { x: WORLD.width - 550, y: 550, spec: PAL_SPECIES[1] },
    { x: 550, y: WORLD.height - 550, spec: PAL_SPECIES[2] },
    { x: WORLD.width - 550, y: WORLD.height - 550, spec: PAL_SPECIES[3] }
  ];
  bossCorners.forEach(b => spawnWildPal(true, b.x, b.y, b.spec));

  // Instanciar Pals capturados del jugador
  state.pals.forEach((pData, idx) => spawnCapturedPalInstance(pData, idx));

  updateHUD();
}

function createResourceNode(x, y, type) {
  return {
    x, y, type,
    hp: type === 'tree' ? 60 : 85,
    maxHp: type === 'tree' ? 60 : 85,
    radius: 26,
    respawnTimer: 0,
    shakeTimer: 0
  };
}

function spawnWildPal(isAlpha = false, fixedX = null, fixedY = null, fixedSpec = null) {
  let x = fixedX, y = fixedY;
  if (x === null || y === null) {
    do {
      x = 140 + Math.random() * (WORLD.width - 280);
      y = 140 + Math.random() * (WORLD.height - 280);
    } while (Math.hypot(x - WORLD.baseX, y - WORLD.baseY) < WORLD.baseRadius + 140);
  }

  const spec = fixedSpec || PAL_SPECIES[Math.floor(Math.random() * PAL_SPECIES.length)];
  const maxHp = isAlpha ? 420 : 100;

  wildPals.push({
    id: 'w_' + Math.random().toString(36).slice(2),
    species: spec,
    isAlpha: isAlpha,
    x, y,
    radius: isAlpha ? 32 : 18,
    hp: maxHp,
    maxHp: maxHp,
    aiTimer: Math.random() * 3,
    targetX: x,
    targetY: y,
    aggroTimer: 0,
    novaCharge: 0, // Contador de ataque especial de área del Jefe
    bounce: Math.random() * 10
  });
}

function spawnCapturedPalInstance(palData, index = 0) {
  const angle = (index * 1.3) % (Math.PI * 2);
  palInstances.push({
    data: palData,
    x: WORLD.baseX + Math.cos(angle) * 90,
    y: WORLD.baseY + Math.sin(angle) * 90,
    radius: palData.isAlpha ? 26 : 18,
    targetNode: null,
    workCooldown: 0,
    bounce: Math.random() * 10
  });
}

/**
 * ============================================================================
 * 4. CONTROLES MULTITÁCTILES Y EVENTOS
 * ============================================================================
 */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') triggerPlayerAttack();
  if (e.key.toLowerCase() === 'q') triggerThrowSphere();
  if (e.key.toLowerCase() === 'e') uiToggleBaseMenu();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  SoundFX.init();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.clientX < window.innerWidth * 0.5 && !joystick.active) {
      joystick.active = true;
      joystick.touchId = t.identifier;
      joystick.startX = t.clientX;
      joystick.startY = t.clientY;
      joystick.currX = t.clientX;
      joystick.currY = t.clientY;
      joystick.dx = 0;
      joystick.dy = 0;
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (joystick.active && t.identifier === joystick.touchId) {
      let dx = t.clientX - joystick.startX;
      let dy = t.clientY - joystick.startY;
      const dist = Math.hypot(dx, dy);
      if (dist > joystick.maxRadius) {
        dx = (dx / dist) * joystick.maxRadius;
        dy = (dy / dist) * joystick.maxRadius;
      }
      joystick.currX = joystick.startX + dx;
      joystick.currY = joystick.startY + dy;
      joystick.dx = dx / joystick.maxRadius;
      joystick.dy = dy / joystick.maxRadius;
    }
  }
}, { passive: false });

function endTouch(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (joystick.active && t.identifier === joystick.touchId) {
      joystick.active = false;
      joystick.touchId = null;
      joystick.dx = 0;
      joystick.dy = 0;
    }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

document.getElementById('btn-attack').addEventListener('touchstart', e => { e.preventDefault(); triggerPlayerAttack(); });
document.getElementById('btn-attack').addEventListener('mousedown', e => { e.preventDefault(); triggerPlayerAttack(); });

document.getElementById('btn-capture').addEventListener('touchstart', e => { e.preventDefault(); triggerThrowSphere(); });
document.getElementById('btn-capture').addEventListener('mousedown', e => { e.preventDefault(); triggerThrowSphere(); });

document.getElementById('btn-base').addEventListener('touchstart', e => { e.preventDefault(); uiToggleBaseMenu(); });
document.getElementById('btn-base').addEventListener('mousedown', e => { e.preventDefault(); uiToggleBaseMenu(); });

/**
 * ============================================================================
 * 5. MECÁNICAS DE COMBATE, RECOLECCIÓN Y CAPTURA
 * ============================================================================
 */
function triggerPlayerAttack() {
  if (player.swingTimer > 0) return;
  player.swingTimer = player.swingDuration;
  SoundFX.swing();

  const attackReach = 72;
  const hitX = player.x + player.dirX * 38;
  const hitY = player.y + player.dirY * 38;
  const dmg = 24 * state.upgrades.playerDamage;

  resources.forEach(res => {
    if (res.hp <= 0) return;
    if (Math.hypot(res.x - hitX, res.y - hitY) <= res.radius + attackReach * 0.6) {
      damageResource(res, dmg, true);
    }
  });

  wildPals.forEach(w => {
    if (Math.hypot(w.x - hitX, w.y - hitY) <= w.radius + attackReach * 0.75) {
      w.hp = Math.max(8, w.hp - dmg * 0.9);
      if (w.aggroTimer <= 0 && w.isAlpha) SoundFX.bossRoar();
      else SoundFX.hitMonster();
      w.aggroTimer = 8;
      spawnPixelParticles(w.x, w.y, '#f87171', 8);
      addFloatingText(w.x, w.y - 30, `-${Math.round(dmg * 0.9)} HP`, '#fca5a5');
    }
  });
}

function damageResource(res, amount, byPlayer = false) {
  res.hp -= amount;
  res.shakeTimer = 0.15;

  if (byPlayer) {
    if (res.type === 'tree') SoundFX.hitWood();
    else SoundFX.hitRock();
  }

  const pColor = res.type === 'tree' ? '#4ade80' : '#38bdf8';
  spawnPixelParticles(res.x, res.y, pColor, 6);

  const gain = Math.max(1, Math.round(amount / 11));
  if (res.type === 'tree') {
    state.wood += gain;
    addFloatingText(res.x, res.y - 26, `+${gain} 🪵`, '#fde047');
  } else {
    state.stone += gain;
    addFloatingText(res.x, res.y - 26, `+${gain} 💎`, '#7dd3fc');
  }

  if (res.hp <= 0) {
    res.respawnTimer = 16;
    spawnPixelParticles(res.x, res.y, '#ffffff', 12);
  }
  updateHUD();
}

function triggerThrowSphere() {
  if (state.spheres <= 0) {
    if (state.wood >= 5 && state.stone >= 5) {
      state.wood -= 5;
      state.stone -= 5;
      state.spheres += 3;
      SoundFX.uiUpgrade();
      addFloatingText(player.x, player.y - 35, '+3 ESFERAS CREADAS', '#38bdf8');
      updateHUD();
    } else {
      SoundFX.uiError();
      addFloatingText(player.x, player.y - 35, 'SIN ESFERAS (5🪵 5💎)', '#f87171');
      return;
    }
  }

  let closest = null;
  let minDist = 390;
  wildPals.forEach(w => {
    const d = Math.hypot(w.x - player.x, w.y - player.y);
    if (d < minDist) {
      minDist = d;
      closest = w;
    }
  });

  state.spheres--;
  SoundFX.throwSphere();
  updateHUD();

  let tx = player.dirX;
  let ty = player.dirY;
  if (closest) {
    const d = Math.hypot(closest.x - player.x, closest.y - player.y);
    tx = (closest.x - player.x) / d;
    ty = (closest.y - player.y) / d;
    player.dirX = tx;
    player.dirY = ty;
  }

  projectiles.push({
    x: player.x,
    y: player.y,
    vx: tx * 480,
    vy: ty * 480,
    radius: 10,
    life: 1.1
  });
}

function attemptCapture(wildPal, indexInArray) {
  const hpFactor = 1 - (wildPal.hp / wildPal.maxHp);
  const baseChance = wildPal.isAlpha ? (0.12 + hpFactor * 0.58) : (0.32 + hpFactor * 0.65);
  const finalChance = Math.min(0.96, baseChance * (1 + (state.upgrades.captureBonus - 1) * 0.22));

  if (Math.random() <= finalChance) {
    SoundFX.captureSuccess();
    spawnPixelParticles(wildPal.x, wildPal.y, '#38bdf8', 22);
    const defaultRole = wildPal.species.type === 'leaf' ? 'chop' : (wildPal.species.type === 'rock' ? 'mine' : 'chop');

    const newPal = {
      id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      name: wildPal.isAlpha ? `Alpha ${wildPal.species.name}` : wildPal.species.name,
      spriteType: wildPal.species.type,
      color: wildPal.species.color,
      isAlpha: wildPal.isAlpha,
      role: defaultRole
    };

    state.pals.push(newPal);
    spawnCapturedPalInstance(newPal, state.pals.length - 1);
    addFloatingText(wildPal.x, wildPal.y - 34, `¡${newPal.name.toUpperCase()} CAPTURADO!`, '#4ade80');

    const wasAlpha = wildPal.isAlpha;
    const oldX = wildPal.x, oldY = wildPal.y, oldSpec = wildPal.species;
    wildPals.splice(indexInArray, 1);

    setTimeout(() => {
      if (wasAlpha) spawnWildPal(true, oldX, oldY, oldSpec);
      else spawnWildPal(false);
    }, wasAlpha ? 25000 : 5000);

    updateHUD();
    saveGame();
  } else {
    SoundFX.captureFail();
    spawnPixelParticles(wildPal.x, wildPal.y, '#f43f5e', 12);
    addFloatingText(wildPal.x, wildPal.y - 34, `¡ESCAPÓ! (${Math.round(finalChance * 100)}%)`, '#fb7185');
    wildPals[indexInArray].aggroTimer = 7;
  }
}

/**
 * ============================================================================
 * 6. BUCLE PRINCIPAL DE ACTUALIZACIÓN (IA + Jefes + Autoguardado)
 * ============================================================================
 */
let lastTime = performance.now();
let passiveIncomeTimer = 0;
let autoSaveTimer = 0;

function update(dt) {
  // Regeneración pasiva dentro de la Base
  if (Math.hypot(player.x - WORLD.baseX, player.y - WORLD.baseY) < WORLD.baseRadius && player.hp < player.maxHp) {
    player.hp = Math.min(player.maxHp, player.hp + 8 * dt);
    updateHUD();
  }

  // Movimiento del Jugador
  let moveX = joystick.dx;
  let moveY = joystick.dy;
  if (!joystick.active) {
    if (keys['w'] || keys['arrowup']) moveY -= 1;
    if (keys['s'] || keys['arrowdown']) moveY += 1;
    if (keys['a'] || keys['arrowleft']) moveX -= 1;
    if (keys['d'] || keys['arrowright']) moveX += 1;
    const len = Math.hypot(moveX, moveY);
    if (len > 1) { moveX /= len; moveY /= len; }
  }

  if (Math.hypot(moveX, moveY) > 0.08) {
    player.x += moveX * player.speed * dt;
    player.y += moveY * player.speed * dt;
    const norm = Math.hypot(moveX, moveY);
    player.dirX = moveX / norm;
    player.dirY = moveY / norm;
  }

  player.x = Math.max(40, Math.min(WORLD.width - 40, player.x));
  player.y = Math.max(40, Math.min(WORLD.height - 40, player.y));
  if (player.swingTimer > 0) player.swingTimer = Math.max(0, player.swingTimer - dt);

  // Actualizar Nodos de Recursos
  resources.forEach(res => {
    if (res.shakeTimer > 0) res.shakeTimer = Math.max(0, res.shakeTimer - dt);
    if (res.hp <= 0) {
      res.respawnTimer -= dt;
      if (res.respawnTimer <= 0) {
        res.hp = res.maxHp;
        spawnPixelParticles(res.x, res.y, '#4ade80', 8);
      }
    }
  });

  // Proyectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;

    let hit = false;
    for (let j = wildPals.length - 1; j >= 0; j--) {
      const w = wildPals[j];
      if (Math.hypot(p.x - w.x, p.y - w.y) <= p.radius + w.radius) {
        hit = true;
        attemptCapture(w, j);
        break;
      }
    }
    if (hit || p.life <= 0) projectiles.splice(i, 1);
  }

  // IA de Monstruos Salvajes y Ataques de Jefes Alpha
  wildPals.forEach(w => {
    w.bounce += dt * (w.isAlpha ? 4.5 : 6.5);
    const distToPlayer = Math.hypot(player.x - w.x, player.y - w.y);

    // Los Jefes Alpha detectan al jugador si se acerca demasiado
    if (w.isAlpha && distToPlayer < 190 && w.aggroTimer <= 0) {
      w.aggroTimer = 6;
      SoundFX.bossRoar();
    }

    if (w.aggroTimer > 0) {
      w.aggroTimer -= dt;
      if (distToPlayer > w.radius + 22) {
        const spd = w.isAlpha ? 95 : 110;
        w.x += ((player.x - w.x) / distToPlayer) * spd * dt;
        w.y += ((player.y - w.y) / distToPlayer) * spd * dt;
      }

      // Ataque de Onda Expansiva del Jefe Alpha
      if (w.isAlpha && distToPlayer < 135) {
        w.novaCharge += dt;
        if (w.novaCharge >= 2.0) {
          w.novaCharge = 0;
          SoundFX.bossRoar();
          spawnPixelParticles(w.x, w.y, '#ef4444', 24);
          if (distToPlayer < 125) {
            player.hp = Math.max(0, player.hp - 18);
            SoundFX.playerHurt();
            addFloatingText(player.x, player.y - 30, '-18 HP ¡ONDA ALPHA!', '#ef4444');
            if (player.hp <= 0) {
              player.hp = player.maxHp;
              player.x = WORLD.baseX;
              player.y = WORLD.baseY + 70;
              addFloatingText(player.x, player.y - 40, 'RESCATADO EN LA BASE', '#38bdf8');
            }
            updateHUD();
          }
        }
      } else {
        w.novaCharge = Math.max(0, w.novaCharge - dt);
      }
    } else {
      w.novaCharge = 0;
      w.aiTimer -= dt;
      if (w.aiTimer <= 0) {
        w.aiTimer = 2 + Math.random() * 3;
        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 110;
        w.targetX = Math.max(120, Math.min(WORLD.width - 120, w.x + Math.cos(angle) * dist));
        w.targetY = Math.max(120, Math.min(WORLD.height - 120, w.y + Math.sin(angle) * dist));
      }
      const d = Math.hypot(w.targetX - w.x, w.targetY - w.y);
      if (d > 8) {
        w.x += ((w.targetX - w.x) / d) * 60 * dt;
        w.y += ((w.targetY - w.y) / d) * 60 * dt;
      }
    }
  });

  // IA de Monstruos Capturados (Los Alpha recolectan 2x más rápido)
  palInstances.forEach((inst, idx) => {
    inst.bounce += dt * 7;
    const role = inst.data.role;
    const alphaMult = inst.data.isAlpha ? 2.0 : 1.0;
    const moveSpeed = 150 * (1 + (state.upgrades.workSpeed - 1) * 0.25);

    if (role === 'follow') {
      const followAngle = (idx * 1.5) + performance.now() * 0.0006;
      const targetX = player.x + Math.cos(followAngle) * 64;
      const targetY = player.y + Math.sin(followAngle) * 64;
      const d = Math.hypot(targetX - inst.x, targetY - inst.y);
      if (d > 10) {
        inst.x += ((targetX - inst.x) / d) * (player.speed * 0.96) * dt;
        inst.y += ((targetY - inst.y) / d) * (player.speed * 0.96) * dt;
      }
      inst.workCooldown = Math.max(0, inst.workCooldown - dt);
      wildPals.forEach(w => {
        if (w.aggroTimer > 0 && Math.hypot(w.x - inst.x, w.y - inst.y) < 110 && inst.workCooldown <= 0) {
          const hitDmg = Math.round(14 * alphaMult);
          w.hp = Math.max(8, w.hp - hitDmg);
          inst.workCooldown = 1.0;
          spawnPixelParticles(w.x, w.y, '#38bdf8', 5);
          addFloatingText(w.x, w.y - 25, `-${hitDmg}`, '#7dd3fc');
        }
      });
    } else {
      const desiredType = role === 'chop' ? 'tree' : 'rock';
      if (!inst.targetNode || inst.targetNode.hp <= 0 || inst.targetNode.type !== desiredType) {
        let best = null;
        let bestDist = Infinity;
        resources.forEach(res => {
          if (res.hp > 0 && res.type === desiredType) {
            const dBase = Math.hypot(res.x - WORLD.baseX, res.y - WORLD.baseY);
            if (dBase < bestDist) {
              bestDist = dBase;
              best = res;
            }
          }
        });
        inst.targetNode = best;
      }

      if (inst.targetNode) {
        const d = Math.hypot(inst.targetNode.x - inst.x, inst.targetNode.y - inst.y);
        if (d > inst.targetNode.radius + inst.radius + 10) {
          inst.x += ((inst.targetNode.x - inst.x) / d) * moveSpeed * dt;
          inst.y += ((inst.targetNode.y - inst.y) / d) * moveSpeed * dt;
        } else {
          inst.workCooldown -= dt * state.upgrades.workSpeed * alphaMult;
          if (inst.workCooldown <= 0) {
            inst.workCooldown = 1.2;
            const workPower = 15 * state.upgrades.workSpeed * alphaMult;
            damageResource(inst.targetNode, workPower, false);
          }
        }
      } else {
        const d = Math.hypot(WORLD.baseX - inst.x, WORLD.baseY - inst.y);
        if (d > 65) {
          inst.x += ((WORLD.baseX - inst.x) / d) * moveSpeed * dt;
          inst.y += ((WORLD.baseY - inst.y) / d) * moveSpeed * dt;
        }
      }
    }
  });

  // Generadores Pasivos de la Base
  passiveIncomeTimer += dt;
  if (passiveIncomeTimer >= 3.0) {
    passiveIncomeTimer = 0;
    if (state.upgrades.lumberMill > 0) {
      const wGain = state.upgrades.lumberMill * 3;
      state.wood += wGain;
      addFloatingText(WORLD.baseX - 80, WORLD.baseY - 45, `+${wGain} 🪵`, '#fde047');
    }
    if (state.upgrades.stoneQuarry > 0) {
      const sGain = state.upgrades.stoneQuarry * 3;
      state.stone += sGain;
      addFloatingText(WORLD.baseX + 80, WORLD.baseY - 45, `+${sGain} 💎`, '#7dd3fc');
    }
    updateHUD();
  }

  autoSaveTimer += dt;
  if (autoSaveTimer >= 6.0) {
    autoSaveTimer = 0;
    saveGame();
  }

  // Partículas Cuadradas Pixeladas
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 30 * dt;
    ft.life -= dt;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

/**
 * ============================================================================
 * 7. RENDERIZADO PIXEL ART (Estilo CrossCode)
 * ============================================================================
 */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const camX = Math.floor(player.x - canvas.width / 2);
  const camY = Math.floor(player.y - canvas.height / 2);

  ctx.save();
  ctx.translate(-camX, -camY);

  // Suelo Verde Azulado Profundo Estilo CrossCode
  ctx.fillStyle = '#152a23';
  ctx.fillRect(0, 0, WORLD.width, WORLD.height);

  // Cuadrícula Tecnológica Sutil
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
  ctx.lineWidth = 2;
  for (let x = 0; x <= WORLD.width; x += 96) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.height); ctx.stroke();
  }
  for (let y = 0; y <= WORLD.height; y += 96) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD.width, y); ctx.stroke();
  }

  // Tiles de Pasto y Flores de Cristal Luminosas
  terrainTiles.forEach(t => {
    if (t.type === 'grass') {
      ctx.fillStyle = t.color;
      ctx.fillRect(t.x, t.y, 12, 6);
      ctx.fillRect(t.x + 3, t.y - 3, 6, 3);
    } else {
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(t.x, t.y, 9, 9);
      ctx.fillStyle = '#67e8f9';
      ctx.fillRect(t.x + 3, t.y + 3, 3, 3);
    }
  });

  // Perímetro Holográfico de la Base
  ctx.save();
  ctx.beginPath();
  ctx.arc(WORLD.baseX, WORLD.baseY, WORLD.baseRadius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(14, 165, 233, 0.08)';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.setLineDash([16, 10]);
  ctx.strokeStyle = '#38bdf8';
  ctx.stroke();
  ctx.restore();

  drawBaseStructures();

  // Dibujar Nodos de Recursos Pixel Art
  resources.forEach(res => {
    if (res.hp <= 0) return;
    const shakeX = res.shakeTimer > 0 ? Math.round((Math.random() - 0.5) * 8) : 0;
    const rx = Math.floor(res.x + shakeX);
    const ry = Math.floor(res.y);

    // Sombra Pixelada
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(rx - 20, ry + 14, 40, 10);

    const spr = SPRITE_CACHE[res.type];
    if (spr) {
      ctx.drawImage(spr, rx - spr.width / 2, ry - spr.height / 2);
    }

    if (res.hp < res.maxHp) {
      drawPixelHealthBar(rx, ry - 34, 44, 7, res.hp / res.maxHp, '#fde047');
    }
  });

  // Dibujar Monstruos Salvajes y Jefes Alpha
  wildPals.forEach(w => {
    const by = Math.round(Math.sin(w.bounce) * 3);
    const wx = Math.floor(w.x);
    const wy = Math.floor(w.y + by);

    // Si es un Jefe Alpha cargando su onda expansiva, dibujar círculo de peligro
    if (w.isAlpha && w.novaCharge > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(w.x, w.y, 125 * (w.novaCharge / 2.0), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(239, 68, 68, 0.28)';
      ctx.fill();
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    // Aura de Jefe Alpha
    if (w.isAlpha) {
      ctx.fillStyle = 'rgba(245, 158, 11, 0.25)';
      ctx.fillRect(wx - 34, wy - 30, 68, 60);
    }

    // Sombra
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(wx - w.radius, Math.floor(w.y + w.radius - 4), w.radius * 2, 8);

    const sprKey = (w.isAlpha ? 'alpha_' : 'pal_') + w.species.type;
    const spr = SPRITE_CACHE[sprKey];
    if (spr) {
      ctx.drawImage(spr, wx - spr.width / 2, wy - spr.height / 2);
    }

    const barOffset = w.isAlpha ? 44 : 28;
    drawPixelHealthBar(wx, wy - barOffset, w.isAlpha ? 68 : 42, 7, w.hp / w.maxHp, w.isAlpha ? '#f59e0b' : '#ef4444');

    const title = w.isAlpha ? `👑 ALPHA ${w.species.name.toUpperCase()}` : w.species.name;
    drawPixelBadge(wx, wy - barOffset - 13, title, w.isAlpha ? '#fde047' : '#fca5a5', '#090d16');
  });

  // Dibujar Monstruos Capturados del Jugador
  palInstances.forEach(inst => {
    const by = Math.round(Math.sin(inst.bounce) * 3);
    const ix = Math.floor(inst.x);
    const iy = Math.floor(inst.y + by);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(ix - 16, Math.floor(inst.y + 14), 32, 7);

    const sprKey = (inst.data.isAlpha ? 'alpha_' : 'pal_') + (inst.data.spriteType || 'leaf');
    const spr = SPRITE_CACHE[sprKey];
    if (spr) {
      ctx.drawImage(spr, ix - spr.width / 2, iy - spr.height / 2);
    }

    let statusLabel = '⚡ SIGUIENDO';
    let badgeColor = '#7dd3fc';
    if (inst.data.role === 'chop') { statusLabel = '🪓 TALANDO'; badgeColor = '#86efac'; }
    else if (inst.data.role === 'mine') { statusLabel = '⛏️ MINANDO'; badgeColor = '#fde047'; }
    if (inst.data.isAlpha) statusLabel = '👑 ' + statusLabel + ' (2x)';

    drawPixelBadge(ix, iy - (inst.data.isAlpha ? 42 : 28), statusLabel, badgeColor, '#090d16');
  });

  // Dibujar Jugador y Espada/Pico de Energía CrossCode
  drawPlayerPixel();

  // Dibujar Esferas Tecnológicas Lanzadas
  projectiles.forEach(p => {
    const px = Math.floor(p.x);
    const py = Math.floor(p.y);
    ctx.fillStyle = '#090d16';
    ctx.fillRect(px - 8, py - 8, 16, 16);
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(px - 6, py - 6, 12, 12);
    ctx.fillStyle = '#67e8f9';
    ctx.fillRect(px - 3, py - 3, 6, 6);
  });

  // Partículas Pixeladas Cuadradas
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.fillRect(Math.floor(pt.x), Math.floor(pt.y), pt.size, pt.size);
  });

  // Textos Flotantes Retro
  floatingTexts.forEach(ft => {
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000000';
    ctx.fillText(ft.text, Math.floor(ft.x) + 2, Math.floor(ft.y) + 2);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, Math.floor(ft.x), Math.floor(ft.y));
  });

  ctx.restore();

  // Radar de Jefes Alpha en los bordes de pantalla + Joystick
  drawBossRadarIndicators();
  drawVirtualJoystick();
}

function drawBaseStructures() {
  const bx = WORLD.baseX;
  const by = WORLD.baseY;

  // Plataforma Octogonal Pixelada de la Base
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(bx - 38, by - 38, 76, 76);
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 4;
  ctx.strokeRect(bx - 38, by - 38, 76, 76);

  // Cristal Central Holográfico
  const pulse = Math.round(Math.sin(performance.now() * 0.005) * 4);
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(bx - 14, by - 14 + pulse, 28, 28);
  ctx.fillStyle = '#67e8f9';
  ctx.fillRect(bx - 7, by - 7 + pulse, 14, 14);

  drawPixelBadge(bx, by - 52, 'TERMINAL CROSS-BASE', '#38bdf8', '#090d16');

  if (state.upgrades.lumberMill > 0) {
    ctx.fillStyle = '#78350f';
    ctx.fillRect(bx - 104, by - 22, 46, 46);
    ctx.strokeStyle = '#fde047';
    ctx.strokeRect(bx - 104, by - 22, 46, 46);
    drawPixelBadge(bx - 81, by - 34, `ASERRADERO NV.${state.upgrades.lumberMill}`, '#fde047', '#090d16');
  }

  if (state.upgrades.stoneQuarry > 0) {
    ctx.fillStyle = '#334155';
    ctx.fillRect(bx + 58, by - 22, 46, 46);
    ctx.strokeStyle = '#38bdf8';
    ctx.strokeRect(bx + 58, by - 22, 46, 46);
    drawPixelBadge(bx + 81, by - 34, `CANTERA NV.${state.upgrades.stoneQuarry}`, '#7dd3fc', '#090d16');
  }
}

function drawPlayerPixel() {
  const px = Math.floor(player.x);
  const py = Math.floor(player.y);

  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(px - 14, py + 15, 28, 7);

  // Hoja de Energía Cian al atacar (Estilo CrossCode Radiant Blade)
  if (player.swingTimer > 0) {
    const baseAngle = Math.atan2(player.dirY, player.dirX);
    const p = 1 - (player.swingTimer / player.swingDuration);
    const swingAngle = baseAngle - 0.9 + (p * 1.8);
    const tx = px + Math.cos(swingAngle) * 34;
    const ty = py + Math.sin(swingAngle) * 34;

    ctx.strokeStyle = '#67e8f9';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(tx, ty);
    ctx.stroke();
  }

  const spr = SPRITE_CACHE['player'];
  if (spr) {
    ctx.drawImage(spr, px - spr.width / 2, py - spr.height / 2);
  }

  drawPixelBadge(px, py - 30, 'SEEKER', '#38bdf8', '#090d16');
}

function drawPixelHealthBar(x, y, w, h, ratio, fillColor) {
  const clamped = Math.max(0, Math.min(1, ratio));
  ctx.fillStyle = '#090d16';
  ctx.fillRect(x - w / 2 - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(x - w / 2, y, w, h);
  ctx.fillStyle = fillColor;
  ctx.fillRect(x - w / 2, y, Math.floor(w * clamped), h);
}

function drawPixelBadge(x, y, text, textColor, bgColor) {
  ctx.font = 'bold 11px "Courier New", monospace';
  const metrics = ctx.measureText(text);
  const w = metrics.width + 10;
  const h = 16;
  ctx.fillStyle = bgColor;
  ctx.fillRect(Math.floor(x - w / 2), Math.floor(y - h / 2), Math.ceil(w), h);
  ctx.strokeStyle = textColor;
  ctx.lineWidth = 1;
  ctx.strokeRect(Math.floor(x - w / 2), Math.floor(y - h / 2), Math.ceil(w), h);
  ctx.fillStyle = textColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, Math.floor(x), Math.floor(y));
}

function drawBossRadarIndicators() {
  wildPals.forEach(w => {
    if (!w.isAlpha) return;
    const dx = w.x - player.x;
    const dy = w.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > Math.min(canvas.width, canvas.height) * 0.48) {
      const angle = Math.atan2(dy, dx);
      const ix = canvas.width / 2 + Math.cos(angle) * (canvas.width * 0.42);
      const iy = canvas.height / 2 + Math.sin(angle) * (canvas.height * 0.38);
      drawPixelBadge(ix, iy, `👑 ${w.species.name} (${Math.round(dist / 10)}m)`, '#fde047', '#090d16');
    }
  });
}

function drawVirtualJoystick() {
  const jx = joystick.active ? joystick.startX : 105;
  const jy = joystick.active ? joystick.startY : canvas.height - 95;
  const kx = joystick.active ? joystick.currX : jx;
  const ky = joystick.active ? joystick.currY : jy;

  ctx.save();
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
  ctx.lineWidth = 3;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.5)';
  ctx.beginPath();
  ctx.arc(jx, jy, joystick.maxRadius, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(kx - 16, ky - 16, 32, 32);
  ctx.strokeStyle = '#ffffff';
  ctx.strokeRect(kx - 16, ky - 16, 32, 32);
  ctx.restore();
}

function spawnPixelParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 100;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      size: 5,
      color,
      life: 0.35 + Math.random() * 0.25
    });
  }
}

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 1.1 });
}

/**
 * ============================================================================
 * 8. INTERFAZ DEL MENÚ CON SONIDOS DE INTERACCIÓN
 * ============================================================================
 */
function updateHUD() {
  document.getElementById('ui-wood').textContent = Math.floor(state.wood);
  document.getElementById('ui-stone').textContent = Math.floor(state.stone);
  document.getElementById('ui-spheres').textContent = state.spheres;
  document.getElementById('ui-pals').textContent = state.pals.length;
  document.getElementById('ui-hp').textContent = Math.ceil(player.hp);
  document.getElementById('modal-pal-count').textContent = state.pals.length;
}

function uiToggleBaseMenu(forceState) {
  const modal = document.getElementById('base-modal');
  const isOpen = modal.style.display === 'flex';
  const next = forceState !== undefined ? forceState : !isOpen;
  modal.style.display = next ? 'flex' : 'none';

  if (next) {
    SoundFX.uiOpen();
    renderPalsModal();
    renderUpgradesModal();
  } else {
    SoundFX.uiClose();
  }
}

function uiSwitchTab(tab) {
  SoundFX.uiTab();
  const btns = document.querySelectorAll('.tab-btn');
  btns[0].classList.toggle('active', tab === 'pals');
  btns[1].classList.toggle('active', tab === 'upgrades');
  document.getElementById('tab-pals').style.display = tab === 'pals' ? 'flex' : 'none';
  document.getElementById('tab-upgrades').style.display = tab === 'upgrades' ? 'flex' : 'none';
  if (tab === 'pals') renderPalsModal();
  else renderUpgradesModal();
}

function renderPalsModal() {
  const container = document.getElementById('pals-list');
  if (state.pals.length === 0) {
    container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 30px; color:#94a3b8;">
      Aún no has capturado monstruos.<br>Debilita un monstruo salvaje con ⚔️ <b>ATACAR</b> y lánzale una 🌐 <b>ESFERA</b>.
    </div>`;
    return;
  }

  container.innerHTML = state.pals.map((pal, idx) => {
    const spr = SPRITE_CACHE['pal_' + (pal.spriteType || 'leaf')];
    const dataUrl = spr ? spr.toDataURL() : '';
    return `
      <div class="pal-card ${pal.isAlpha ? 'alpha-card' : ''}">
        <div class="pal-card-header">
          <div class="pal-avatar">
            ${dataUrl ? `<img src="${dataUrl}" width="32" height="32" style="image-rendering:pixelated;">` : '👾'}
          </div>
          <div>
            <div style="font-weight:bold; font-size:14px; color:${pal.isAlpha ? '#fde047' : '#f8fafc'};">
              ${pal.isAlpha ? '👑 ' : ''}${pal.name} #${idx + 1}
            </div>
            <div style="font-size:11px; color:#7dd3fc;">
              ${pal.isAlpha ? 'Jefe Alpha (Velocidad 2x)' : 'Unidad de Base (1x)'}
            </div>
          </div>
        </div>
        <div class="role-buttons">
          <button class="role-btn ${pal.role === 'chop' ? 'active' : ''}" onclick="setPalRole('${pal.id}', 'chop')">🪓 TALAR</button>
          <button class="role-btn ${pal.role === 'mine' ? 'active' : ''}" onclick="setPalRole('${pal.id}', 'mine')">⛏️ MINAR</button>
          <button class="role-btn ${pal.role === 'follow' ? 'active' : ''}" onclick="setPalRole('${pal.id}', 'follow')">⚡ SEGUIR</button>
        </div>
      </div>
    `;
  }).join('');
}

window.setPalRole = function(palId, newRole) {
  SoundFX.uiClick();
  const p = state.pals.find(item => item.id === palId);
  if (p) {
    p.role = newRole;
    const inst = palInstances.find(i => i.data.id === palId);
    if (inst) inst.targetNode = null;
    saveGame();
    renderPalsModal();
  }
};

function renderUpgradesModal() {
  const u = state.upgrades;
  const items = [
    {
      key: 'spheresPack',
      title: '🌐 PACK 5 ESFERAS PAL',
      desc: 'Sintetiza 5 esferas tecnológicas de captura.',
      woodCost: 10,
      stoneCost: 10,
      levelText: `STOCK: ${state.spheres}`
    },
    {
      key: 'playerDamage',
      title: '⚔️ HOJA RADIANTE (DAÑO)',
      desc: 'Aumenta el daño de tu arma para debilitar Jefes Alpha.',
      woodCost: u.playerDamage * 25,
      stoneCost: u.playerDamage * 25,
      levelText: `NV. ${u.playerDamage}`
    },
    {
      key: 'workSpeed',
      title: '⚡ OVERCLOCK DE BASE',
      desc: 'Tus Pals talan, minan y se mueven un 25% más rápido.',
      woodCost: u.workSpeed * 25,
      stoneCost: u.workSpeed * 20,
      levelText: `NV. ${u.workSpeed}`
    },
    {
      key: 'captureBonus',
      title: '🎯 MÓDULO DE CAPTURA',
      desc: 'Aumenta la probabilidad de capturar Pals y Jefes Alpha.',
      woodCost: u.captureBonus * 20,
      stoneCost: u.captureBonus * 30,
      levelText: `NV. ${u.captureBonus}`
    },
    {
      key: 'lumberMill',
      title: '🪚 ASERRADERO AUTOMÁTICO',
      desc: 'Genera madera automáticamente en la base cada 3 seg.',
      woodCost: (u.lumberMill + 1) * 35,
      stoneCost: (u.lumberMill + 1) * 20,
      levelText: `NV. ${u.lumberMill}`
    },
    {
      key: 'stoneQuarry',
      title: '🏗️ CANTERA DE CRISTAL',
      desc: 'Genera mineral automáticamente en la base cada 3 seg.',
      woodCost: (u.stoneQuarry + 1) * 20,
      stoneCost: (u.stoneQuarry + 1) * 35,
      levelText: `NV. ${u.stoneQuarry}`
    }
  ];

  const container = document.getElementById('upgrades-list');
  container.innerHTML = items.map(item => {
    const canAfford = state.wood >= item.woodCost && state.stone >= item.stoneCost;
    return `
      <div class="upgrade-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="font-size:13px; color:#38bdf8;">${item.title}</strong>
          <span style="background:#090d16; padding:3px 7px; border:1px solid #38bdf8; font-size:11px;">${item.levelText}</span>
        </div>
        <p style="font-size:12px; color:#94a3b8;">${item.desc}</p>
        <div style="font-size:12px; font-weight:bold; color:#fde047;">
          COSTO: ${item.woodCost} 🪵 | ${item.stoneCost} 💎
        </div>
        <button class="buy-btn" ${canAfford ? '' : 'disabled'} onclick="buyUpgrade('${item.key}', ${item.woodCost}, ${item.stoneCost})">
          ${canAfford ? 'CONSTRUIR / MEJORAR' : 'RECURSOS INSUFICIENTES'}
        </button>
      </div>
    `;
  }).join('');
}

window.buyUpgrade = function(key, wCost, sCost) {
  if (state.wood < wCost || state.stone < sCost) {
    SoundFX.uiError();
    return;
  }
  SoundFX.uiUpgrade();
  state.wood -= wCost;
  state.stone -= sCost;

  if (key === 'spheresPack') {
    state.spheres += 5;
  } else {
    state.upgrades[key]++;
  }

  updateHUD();
  saveGame();
  renderUpgradesModal();
};

// ============================================================================
// ARRANCAR EL JUEGO
// ============================================================================
function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

initWorld();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
