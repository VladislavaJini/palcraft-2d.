<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nexus Creatures - Vertical Engine Phase 1</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    image-rendering: pixelated;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #060a12;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* HUD Superior Vertical Estricto */
  #hud-top {
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 15;
    pointer-events: none;
  }
  .player-card {
    background: linear-gradient(180deg, rgba(14, 25, 45, 0.95) 0%, rgba(8, 14, 28, 0.97) 100%);
    border: 2px solid #00d2ff;
    border-radius: 8px;
    padding: 6px 12px;
    color: white;
    font-size: 12px;
    box-shadow: 0 0 14px rgba(0, 210, 255, 0.4);
    pointer-events: auto;
  }

  /* Controles Táctiles Fase 1 (Joystick izquierdo + Botón de ataque derecho) */
  #controls-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  .action-btn-f1 {
    position: absolute;
    bottom: 25px;
    right: 25px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0284c7, #1d4ed8);
    border: 3px solid #bae6fd;
    color: white;
    font-weight: 800;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 0 #050811, 0 0 16px rgba(0, 210, 255, 0.5);
    cursor: pointer;
    pointer-events: auto;
    text-shadow: 1px 1px 0 #000;
  }
  .action-btn-f1:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #050811;
  }
</style>
</head>
<body>

<div id="hud-top">
  <div class="player-card">
    <div style="font-weight:bold; color:#38bdf8;">NEXUS CREATURES</div>
    <div style="font-size:10px; color:#cbd5e1; margin-top:2px;">Fase 1: Vertical & Controles</div>
  </div>
  <div class="player-card" style="text-align:right;">
    <div style="font-size:10px; color:#4ade80;">● FASE 1 ACTIVA</div>
    <div style="font-size:11px; font-weight:bold;">Modo Portrait 9:16</div>
  </div>
</div>

<div id="controls-container">
  <button class="action-btn-f1" onclick="triggerAction()">
    <span style="font-size:22px;">⚔️</span>
    <span>ATACAR</span>
  </button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Joystick Virtual Táctil Izquierdo
let joystick = {
  active: false,
  touchId: null,
  startX: 90,
  startY: window.innerHeight - 110,
  currX: 90,
  currY: window.innerHeight - 110,
  dx: 0,
  dy: 0,
  maxRadius: 55
};

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.clientX < window.innerWidth * 0.55 && !joystick.active) {
      joystick.active = true;
      joystick.touchId = t.identifier;
      joystick.startX = t.clientX;
      joystick.startY = t.clientY;
      joystick.currX = t.clientX;
      joystick.currY = t.clientY;
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (joystick.active && t.identifier === joystick.touchId) {
      let dx = t.clientX - joystick.startX;
      let dy = t.clientY - joystick.startY;
      const dist = Math.hypot(dx, dy);
      if (dist > joystick.maxRadius) {
        dx = (dx / dist) * joystick.maxRadius;
        dy = (dy / dist) * joystick.maxRadius;
      }
      joystick.currX = joystick.startX + dx;
      joystick.currY = joystick.startY + dy;
      joystick.dx = dx / joystick.maxRadius;
      joystick.dy = dy / joystick.maxRadius;
    }
  }
}, { passive: false });

function endTouch(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (joystick.active && t.identifier === joystick.touchId) {
      joystick.active = false;
      joystick.touchId = null;
      joystick.dx = 0;
      joystick.dy = 0;
    }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

// Posición del jugador en el mundo virtual
let player = {
  x: 1400,
  y: 1400,
  speed: 240,
  radius: 20
};

function triggerAction() {
  player.speed = player.speed === 240 ? 360 : 240; // Efecto visual simple de prueba al tocar atacar
}

let lastTime = performance.now();

function update(dt) {
  if (Math.abs(joystick.dx) > 0.05 || Math.abs(joystick.dy) > 0.05) {
    player.x += joystick.dx * player.speed * dt;
    player.y += joystick.dy * player.speed * dt;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const camX = Math.floor(player.x - canvas.width / 2);
  const camY = Math.floor(player.y - canvas.height / 2);

  ctx.save();
  ctx.translate(-camX, -camY);

  // Renderizar fondo verde pradera de prueba Fase 1
  ctx.fillStyle = '#3f6a34';
  ctx.fillRect(0, 0, 2800, 2800);

  // Cuadrícula de referencia visual
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  for (let x = 0; x <= 2800; x += 100) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 2800); ctx.stroke();
  }
  for (let y = 0; y <= 2800; y += 100) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(2800, y); ctx.stroke();
  }

  // Dibujar al jugador provisional (círculo estilizado con indicador de dirección)
  ctx.fillStyle = '#1d4ed8';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#00d2ff';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();

  // Dibujar Joystick Táctil en pantalla fija
  if (joystick.active) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 210, 255, 0.7)';
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(10, 20, 38, 0.5)';
    ctx.beginPath();
    ctx.arc(joystick.startX, joystick.startY, joystick.maxRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(joystick.currX, joystick.currY, 22, 0, Math.PI * 2);
    ctx.fillStyle = '#00d2ff';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
    ctx.restore();
  }
}

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
